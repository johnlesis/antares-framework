name: Split

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      # Installs from the monorepo root: every package is symlinked from
      # packages/ via path repositories, so CI tests the code in this commit.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

  packages_split:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        package:
          - local_path: 'core'
            split_repository: 'antares'
          - local_path: 'validation'
            split_repository: 'antares-validation'
          - local_path: 'container'
            split_repository: 'antares-container'
          - local_path: 'router'
            split_repository: 'antares-router'
          - local_path: 'bridges/monolog'
            split_repository: 'antares-monolog-bridge'
          - local_path: 'bridges/eloquent'
            split_repository: 'antares-eloquent-bridge'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - if: "!startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.4.0
        with:
          package_directory: 'packages/${{ matrix.package.local_path }}'
          repository_organization: 'johnlesis'
          repository_name: '${{ matrix.package.split_repository }}'
          branch: 'main'
          user_name: 'johnlesis'
          user_email: 'johnlesis91@gmail.com'

      - if: "startsWith(github.ref, 'refs/tags/')"
        uses: danharrin/monorepo-split-github-action@v2.4.0
        with:
          package_directory: 'packages/${{ matrix.package.local_path }}'
          repository_organization: 'johnlesis'
          repository_name: '${{ matrix.package.split_repository }}'
          branch: 'main'
          tag: ${{ github.ref_name }}
          user_name: 'johnlesis'
          user_email: 'johnlesis91@gmail.com'